name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  roi-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Recovered ROI for well-identified channels must be within 30% of truth
        run: uv run --python 3.12 mediamix eval --gate --out reports-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roi-report
          path: reports-ci/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t media-mix:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name mediamix -e MEDIAMIX_BOOT=30 -p 8859:8859 media-mix:ci
          for i in $(seq 1 180); do curl -sf localhost:8859/healthz && break; sleep 1; done
          curl -sf localhost:8859/healthz || { docker logs mediamix | tail -50; exit 1; }
          curl -sf localhost:8859/api/fit | head -c 300
          curl -sf -X POST localhost:8859/api/optimize -H 'content-type: application/json' \
            -d '{"quarter_budget":4000000,"uncertainty":false}' | head -c 300
          curl -sf localhost:8859/metrics | grep mediamix_gate_pass
          docker rm -f mediamix
