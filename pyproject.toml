[project]
name = "mediamix"
version = "1.0.0"
description = "Marketing mix modeling for a made-up DTC brand across 7 channels: a seeded synthetic world with known true ROI, adstock and Hill transforms, constrained ridge with block bootstrap intervals, lift-test calibration, response curves, and a budget optimizer."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.scripts]
mediamix = "mediamix.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediamix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
